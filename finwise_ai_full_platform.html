
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07080c;color:#eef0f6;font-family:'DM Sans',sans-serif;font-size:14px}
.syne{font-family:'Syne',sans-serif}
input,select{background:#0f1118;border:1px solid #1c2333;color:#eef0f6;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;border-radius:8px;padding:9px 12px;transition:border-color 0.2s}
input:focus,select:focus{border-color:#00c8f040}
button{font-family:'DM Sans',sans-serif;cursor:pointer;transition:opacity 0.15s,transform 0.1s;border:none}
button:hover{opacity:0.82}
button:active{transform:scale(0.97)}
select option{background:#0f1118}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:0.3;transform:scale(0.75)}50%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:0.6}50%{opacity:1}}
.fade{animation:fadeUp 0.35s ease both}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:#00e57a;animation:pulse 2s infinite}
</style>

<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Finwise AI — interactive stock market intelligence platform demo with dashboard, AI chat, paper trading, and portfolio analytics</h2>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const K={
  bg:'#07080c',sur:'#0d0f16',card:'#11141e',bdr:'#1c2333',bdrL:'#232d42',
  cy:'#00c8f0',gr:'#00e57a',rd:'#ff3f61',pu:'#7b5cf0',am:'#f59f0b',
  t1:'#eef0f6',t2:'#6b7a96',t3:'#2e3850'
};

function $r(n){return n.toFixed(2)}
function fm(n){return'$'+Math.round(n).toLocaleString()}
function fmd(n){return'$'+n.toFixed(2)}
function pclr(p){return p>=0?K.gr:K.rd}
function psign(p){return p>=0?'+':''}
function gd(base,n=35){
  let a=[],p=base;
  for(let i=0;i<n;i++){p=Math.max(p*(1+(Math.random()-0.47)*0.028),base*0.55);a.push(Math.round(p*100)/100)}
  return a;
}

const STOCKS=[
  {sym:'AAPL',nm:'Apple Inc.',px:189.25,ch:2.34,pc:1.25,cap:'$2.94T',pe:29.2,d:gd(189)},
  {sym:'TSLA',nm:'Tesla Inc.',px:248.50,ch:-5.20,pc:-2.05,cap:'$790B',pe:51.3,d:gd(248)},
  {sym:'MSFT',nm:'Microsoft',px:415.80,ch:6.10,pc:1.49,cap:'$3.09T',pe:35.8,d:gd(415)},
  {sym:'NVDA',nm:'NVIDIA',px:875.40,ch:23.50,pc:2.76,cap:'$2.16T',pe:68.4,d:gd(875)},

let state={
  page:'land',

  loading:false,
  pos:[{sym:'AAPL',sh:10,avg:165},{sym:'MSFT',sh:5,avg:380},{sym:'NVDA',sh:3,avg:750}],

let charts={};
function destroyChart(id){if(charts[id]){charts[id].destroy();delete charts[id];}}

function badge(txt,col,bg){
  bg=bg||col+'1a';
  return `<span style="display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:30px;font-size:11px;font-weight:600;background:${bg};color:${col}">${txt}</span>`;
}

function card(inner,style=''){
  return `<div style="background:${K.card};border:1px solid ${K.bdr};border-radius:15px;padding:20px;${style}">${inner}</div>`;
}

function statsCard(label,val,sub,col){
  return `<div style="background:${K.card};border:1px solid ${K.bdr};border-radius:12px;padding:16px">
    <div style="font-size:11px;color:${K.t3};text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px">${label}</div>
    <div style="font-size:20px;font-weight:700;margin-bottom:3px">${val}</div>
    <div style="font-size:11px;color:${col||K.t2}">${sub}</div>

}

function navBtn(pg,lbl){

  </div>`;
}

  let html='';
  if(state.page==='land') html=renderLanding();
  else if(state.page==='dashboard') html=renderDashboard();

    charts[id]=new Chart(c,{
      type:'line',
      data:{labels,datasets:[{data,borderColor:color,borderWidth:fill?2:1.5,pointRadius:0,tension:0.35,fill,backgroundColor:color+'28'}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:fill,backgroundColor:'#11141e',borderColor:'#1c2333',borderWidth:1,bodyColor:'#eef0f6',callbacks:{label:ctx=>'$'+ctx.parsed.y.toFixed(2)}}},scales:{x:{display:false},y:{display:fill,position:'right',grid:{color:'#1c233360'},ticks:{color:'#2e3850',font:{size:10},callback:v=>'$'+Math.round(v)}}},animation:{duration:600}}

function setTmode(m){state.tmode=m;render();}
function setSh(v){state.tsh=Math.max(1,parseInt(v)||1);render();}

function execTrade(type){
  const sel=STOCKS.find(s=>s.sym===state.tsym)||STOCKS[0];
  const cost=sel.px*state.tsh;
  if(type==='buy'){
    if(cost>state.cash){alert('Insufficient funds! Need '+fm(cost)+', have '+fm(state.cash));return;}
    state.cash-=cost;
    const ex=state.pos.find(p=>p.sym===state.tsym);
    if(ex){
      const newSh=ex.sh+state.tsh;
      ex.avg=(ex.avg*ex.sh+cost)/newSh;
      ex.sh=newSh;
    } else {
      state.pos.push({sym:state.tsym,sh:state.tsh,avg:sel.px});
    }
    alert('Bought '+state.tsh+' shares of '+state.tsym+' for '+fm(cost));
  } else {
    const pos=state.pos.find(p=>p.sym===state.tsym);
    if(!pos||pos.sh<state.tsh){alert('Insufficient shares!');return;}
    state.cash+=cost;
    pos.sh-=state.tsh;
    if(pos.sh===0) state.pos=state.pos.filter(p=>p.sym!==state.tsym);
    alert('Sold '+state.tsh+' shares of '+state.tsym+' for '+fm(cost));
  }
  render();
}

async function doChat(){
  const input=(document.getElementById('ci')?.value||state.input).trim();
  if(!input||state.loading)return;
  state.msgs.push({r:'user',c:input});
  state.input='';
  state.loading=true;
  render();
  const box=document.getElementById('chatbox');
  if(box) box.scrollTop=box.scrollHeight;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:'You are Finwise AI, an expert stock market and financial analysis assistant. Provide concise, insightful, data-driven responses. Use bullet points for clarity when listing multiple items. Current date: May 2026. Be helpful, precise, and professional. Format your response clearly.',
        messages:state.msgs.filter(m=>m.r==='user').slice(-6).concat([{role:'user',content:input}]).map(m=>({role:m.r==='user'?'user':'assistant',content:m.c}))
      })
    });
    const data=await res.json();
    const reply=data.content?.[0]?.text||'I encountered an error. Please try again.';
    state.msgs.push({r:'ai',c:reply});
  } catch(e){
    state.msgs.push({r:'ai',c:'Unable to connect to AI service. Please check your internet connection and try again.'});
  }
  state.loading=false;
  render();
